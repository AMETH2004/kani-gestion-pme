<div class="login-wrap d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm border-0" style="max-width: 400px; width: 100%">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="logo-badge mx-auto mb-3">K</div>
        <h1 class="h4 mb-1">Kani</h1>
        <p class="text-muted small mb-0">Gestion commerciale — facturation & stock</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="soumettre()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Adresse e-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
            autocomplete="username"
          />
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="enCours()">
          @if (enCours()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Se connecter
        </button>
      </form>

      <p class="text-muted small text-center mt-4 mb-0">
        Démo : admin&#64;kani.test / password
      </p>
    </div>
  </div>
</div>
