<div class="d-flex align-items-center gap-2 mb-3">
  <a routerLink="/devis" class="btn btn-light"><i class="bi bi-arrow-left"></i></a>
  <h1 class="h3 mb-0">{{ editionId() ? 'Modifier le devis' : 'Nouveau devis' }}</h1>
</div>

@if (chargement()) {
  <div class="text-center py-5"><span class="spinner-border"></span></div>
} @else {
  <form [formGroup]="form" (ngSubmit)="enregistrer()">
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Client *</label>
            <select class="form-select" formControlName="client_id">
              <option [ngValue]="null">— Sélectionner —</option>
              @for (c of clients(); track c.id) {
                <option [ngValue]="c.id">{{ c.nom }}</option>
              }
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Date du devis *</label>
            <input type="date" class="form-control" formControlName="date_devis" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Valable jusqu'au</label>
            <input type="date" class="form-control" formControlName="date_validite" />
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <app-lignes-editor [parent]="form" [produits]="produits()" />
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <label class="form-label">Notes / conditions</label>
        <textarea class="form-control" rows="2" formControlName="notes"></textarea>
      </div>
    </div>

    <div class="d-flex gap-2">
      <a routerLink="/devis" class="btn btn-light">Annuler</a>
      <button type="submit" class="btn btn-primary" [disabled]="enregistrement()">
        <i class="bi bi-check-lg me-1"></i>Enregistrer le devis
      </button>
    </div>
  </form>
}
