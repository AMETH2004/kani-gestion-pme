<div class="d-flex align-items-center gap-2 mb-3">
  <a routerLink="/factures" class="btn btn-light"><i class="bi bi-arrow-left"></i></a>
  <h1 class="h3 mb-0">Nouvelle facture</h1>
</div>

<form [formGroup]="form" (ngSubmit)="enregistrer()">
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label">Client *</label>
          <select class="form-select" formControlName="client_id">
            <option [ngValue]="null">— Sélectionner —</option>
            @for (c of clients(); track c.id) {
              <option [ngValue]="c.id">{{ c.nom }}</option>
            }
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Date de facture *</label>
          <input type="date" class="form-control" formControlName="date_facture" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Échéance</label>
          <input type="date" class="form-control" formControlName="date_echeance" />
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <app-lignes-editor [parent]="form" [produits]="produits()" />
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <label class="form-label">Notes</label>
      <textarea class="form-control" rows="2" formControlName="notes"></textarea>
    </div>
  </div>

  <div class="alert alert-info small">
    <i class="bi bi-info-circle me-1"></i>
    La facture est créée en <strong>brouillon</strong>. Le stock ne sera décrémenté qu'à sa validation.
  </div>

  <div class="d-flex gap-2">
    <a routerLink="/factures" class="btn btn-light">Annuler</a>
    <button type="submit" class="btn btn-primary" [disabled]="enregistrement()">
      <i class="bi bi-check-lg me-1"></i>Créer la facture
    </button>
  </div>
</form>
